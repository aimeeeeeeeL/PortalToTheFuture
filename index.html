<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- Makes the page match the device screen -->
  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover"
  >

  <title>Suzhou AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* Force the AR scene to fill the entire device screen */
    a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Make MindAR camera/video fill the screen */
    video {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      object-fit: cover !important;
    }

    canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: true;
      uiScanning: yes;
    "
    embedded
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      antialias: true;
      alpha: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- CAMERA -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- IMAGE TARGET -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- TEST RED BOX -->
      <a-box
        position="0 0 0.1"
        scale="0.3 0.3 0.3"
        color="red"
      ></a-box>

    </a-entity>

  </a-scene>

</body>
</html>
